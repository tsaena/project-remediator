name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: docker compose build
      - name: Containerized scan of the vulnerable fixture
        run: |
          mkdir scan-out
          docker compose --profile scan run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/tests/fixtures/vulnerable-python:/target:ro" \
            scan /target --artifacts /out/artifacts \
            --asset-key ci/vulnerable-python --output /out/report.json
          python3 - <<'PY'
          import json
          report = json.load(open("scan-out/report.json"))
          assert report["status"] == "success", report["status"]
          assert report["scanner"]["version"] == "2.3.0", report["scanner"]
          assert report["coverage"]["status"] == "no_known_gaps"
          names = {f["component"]["name"].lower() for f in report["findings"]}
          assert names == {"django"}, names
          print(len(report["findings"]), "findings")
          PY
